<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="diamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.95)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.7)"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>

  <!-- Diamond gem icon centered -->
  <polygon points="16,4 22,11 16,11" fill="white" opacity="0.6"/>
  <polygon points="16,4 10,11 16,11" fill="white" opacity="0.9"/>
  <polygon points="10,11 16,26 22,11" fill="white"/>
  <polygon points="16,11 16,26 22,11" fill="white" opacity="0.75"/>
</svg>
